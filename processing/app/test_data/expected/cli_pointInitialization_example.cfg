#
#	This is an example command line interface (cli) configuration file.
#
#	This particular file illustrates the necessary options settings to
#	do a single time step point initialization run local data and diurnal winds.  The mesh is set
#	to a specified resolution of 250 meters.  A weather station kml
#	file is written.
#
num_threads              = 1
elevation_file           = ./tinitaly/w46085_s10/w46085_s10.tif
time_zone                = auto-detect
initialization_method    = pointInitialization
match_points             = true
wx_station_filename      = ./stazioni/italy_lazio_stations_1.csv
write_wx_station_kml     = true
output_wind_height       = 10
units_output_wind_height = m
vegetation               = trees [input frontend]
mesh_resolution          = 500.0
units_mesh_resolution    = m
write_goog_output        = true
write_shapefile_output   = true
write_ascii_output       = true
write_farsite_atm        = false

